# PropMange Production Stack
# Services: PostgreSQL, Redis, Authentik (OIDC), Caddy (Reverse Proxy), Spring Boot API, Cloudflare Tunnel.
# The UI is served via Cloudflare Pages and connects to this API.

services:
  # --- Single Postgres: propmanager DB (app) + authentik DB (Authentik) ---
  postgres:
    image: postgres:17-alpine
    container_name: prop-manager-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d postgres && pg_isready -U propmanager -d propmanager && pg_isready -U authentik -d authentik",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 25s
    restart: unless-stopped
    networks:
      - internal

  redis:
    image: redis:alpine
    container_name: prop-manager-redis
    command: --save 60 1 --loglevel warning
    volumes:
      - authentik_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - internal

  # --- Authentik (OIDC Provider) ---
  authentik:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2025.4.4}
    container_name: authentik-server
    command: server
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?set AUTHENTIK_SECRET_KEY in .env}
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD}
      # Must be set so JWT 'iss' claims use the external domain, not the internal container hostname.
      AUTHENTIK_HOST: https://${AUTH_DOMAIN}
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    networks:
      - internal

  authentik-worker:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2025.4.4}
    container_name: authentik-worker
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD}
      AUTHENTIK_HOST: https://${AUTH_DOMAIN}
    volumes:
      - authentik_media:/media
      - authentik_certs:/certs
      - authentik_templates:/templates
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
    networks:
      - internal

  # --- Caddy (Reverse Proxy + Forward Auth) ---
  caddy:
    image: caddy:2-alpine
    container_name: prop-manager-caddy
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
      AUTH_DOMAIN: ${AUTH_DOMAIN:?set AUTH_DOMAIN in .env}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      authentik: { condition: service_started }
      app: { condition: service_healthy }
    restart: unless-stopped
    networks:
      - internal
      - public

  # --- PropMange API ---
  app:
    build: .
    container_name: prop-manager-app
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_HOST: postgres
      POSTGRES_DB: propmanager
      POSTGRES_USER: propmanager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Derived from AUTH_DOMAIN — must match the 'iss' claim in JWTs issued by Authentik
      AUTH_ISSUER_URI: https://${AUTH_DOMAIN}/application/o/prop-manager/
      # Internal JWKS URL — Spring Boot fetches public keys directly from Authentik container (avoids round-trip through tunnel)
      JWKS_URI: http://authentik:9000/application/o/prop-manager/jwks/
      CORS_ALLOWED_ORIGIN: https://${UI_DOMAIN}
      APP_BASE_URL: https://${API_DOMAIN}
      AUTH_LOGOUT_URL: https://${AUTH_DOMAIN}/application/o/prop-manager/end-session/
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/actuator/health/liveness || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - internal

  # --- Cloudflare Tunnel ---
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: prop-manager-tunnel
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    restart: unless-stopped
    networks:
      - public
    depends_on:
      - caddy

networks:
  internal:
    driver: bridge
  public:
    driver: bridge

volumes:
  postgres_data:
  authentik_redis:
  authentik_media:
  authentik_certs:
  authentik_templates:
  caddy_data:
