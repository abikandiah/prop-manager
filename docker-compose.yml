# PropMange Production Stack
# Services: PostgreSQL, Logto (OIDC), Caddy (Reverse Proxy), Spring Boot API, Cloudflare Tunnel.
# The UI is served via Cloudflare Pages and connects to this API.

services:
  # --- Single Postgres: propmanager DB (app) + logto DB (Logto) ---
  postgres:
    # Major stays pinned: upgrading needs a dump/restore (see docker/README.md)
    image: postgres:18-alpine
    container_name: prop-manager-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
    volumes:
      # 18+ images keep data under /var/lib/postgresql/<major>/docker
      - pgdata:/var/lib/postgresql
      - ./docker/init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d postgres && pg_isready -U propmanager -d propmanager && pg_isready -U logto -d logto",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 25s
    restart: unless-stopped
    networks:
      - internal

  # --- Logto (OIDC Provider) ---
  logto:
    image: svhd/logto:latest
    container_name: prop-manager-logto
    # Seeds the DB on first run (no-op if already seeded), then starts the server.
    entrypoint: ["sh", "-c", "npx @logto/cli db seed --db-url $$DB_URL || true && cd /etc/logto/packages/core && NODE_ENV=production node ."]
    ports:
      - "127.0.0.1:3002:3002" # Admin console — host-local only; reach it via SSH tunnel
    environment:
      DB_URL: postgresql://logto:${POSTGRES_PASSWORD}@postgres:5432/logto
      # Public-facing OIDC endpoint; must match the 'iss' claim in issued JWTs.
      ENDPOINT: https://${AUTH_DOMAIN}
      TRUST_PROXY_HEADER: 1
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    networks:
      - internal

  # --- Caddy (Reverse Proxy + Forward Auth) ---
  caddy:
    image: caddy:alpine
    container_name: prop-manager-caddy
    ports:
      - "80:80"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
      AUTH_DOMAIN: ${AUTH_DOMAIN:?set AUTH_DOMAIN in .env}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      logto: { condition: service_started }
      app: { condition: service_healthy }
    restart: unless-stopped
    networks:
      - internal
      - public

  # --- PropMange API ---
  app:
    build: .
    container_name: prop-manager-app
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: prod
      POSTGRES_HOST: postgres
      POSTGRES_DB: propmanager
      POSTGRES_USER: propmanager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Must match the 'iss' claim in JWTs issued by Logto (ENDPOINT + /oidc)
      AUTH_ISSUER_URI: https://${AUTH_DOMAIN}/oidc
      # Internal JWKS URL — fetched directly from Logto container (avoids round-trip through tunnel)
      JWKS_URI: http://logto:3001/oidc/jwks
      CORS_ALLOWED_ORIGINS: https://${UI_DOMAIN},http://localhost,http://localhost:3000,http://localhost:3001
      APP_BASE_URL: https://${UI_DOMAIN}
      AUTH_LOGOUT_URL: https://${AUTH_DOMAIN}/oidc/session/end
      MAIL_HOST: ${MAIL_HOST:-smtp.resend.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-resend}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?set MAIL_PASSWORD in .env}
      MAIL_FROM: ${MAIL_FROM:-no-reply@propmanager.com}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/actuator/health/liveness || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - internal

  # --- DB Scheduler ---
  # Truncates all propmanager app tables on a cron schedule.
  # Default: 0 3 * * 0  → Sundays at 03:00 UTC
  # Override via DB_CLEAR_SCHEDULE in .env (standard cron syntax).
  db-scheduler:
    image: postgres:18-alpine
    container_name: prop-manager-db-scheduler
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGDATABASE: propmanager
      PGUSER: propmanager
      PGPASSWORD: ${POSTGRES_PASSWORD}
      DB_CLEAR_SCHEDULE: ${DB_CLEAR_SCHEDULE:-0 3 * * 0}
    entrypoint: ["/bin/sh", "/db-scheduler/entrypoint.sh"]
    volumes:
      - ./docker/db-scheduler:/db-scheduler:ro
    restart: unless-stopped
    networks:
      - internal

  # --- Cloudflare Tunnel ---
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: prop-manager-tunnel
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    restart: unless-stopped
    networks:
      - public
    depends_on:
      - caddy

networks:
  internal:
    driver: bridge
  public:
    driver: bridge

volumes:
  pgdata:
  caddy_data:
