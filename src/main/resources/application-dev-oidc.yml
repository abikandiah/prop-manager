# dev-oidc profile: Postgres + Logto OIDC (no H2, no local JWT).
# Postgres + Logto start with the devcontainer (.devcontainer/docker-compose.yml). Run the app:
#   SPRING_PROFILES_ACTIVE=dev-oidc ./mvnw spring-boot:run
spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:propmanager}
    username: ${POSTGRES_USER:propmanager}
    password: ${POSTGRES_PASSWORD:devpassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        from: ${MAIL_FROM:noreply@propmanager.local}
        smtp:
          auth: false
          starttls:
            enable: false
            required: false
          ssl:
            enable: false
  security:
    oauth2:
      resourceserver:
        jwt:
          # Fetched directly from Logto container via service name (container-to-container).
          jwk-set-uri: ${JWKS_URI:http://logto:3001/oidc/jwks}
          # Must match Logto's ENDPOINT + /oidc (what the browser sees).
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:3001/oidc}

app:
  base-url: ${APP_BASE_URL:http://localhost:3000}
  auth:
    logout-url: ${AUTH_LOGOUT_URL:http://localhost:3001/oidc/session/end}
  rate-limit:
    enabled: false
  cors:
    enabled: true
    allowed-origins: http://localhost:3000, http://127.0.0.1:3000
    allowed-methods: GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD
    allowed-headers: Authorization, Content-Type, X-Request-Id
    allow-credentials: true
    max-age: 3600
  audit:
    enabled: true
    include-query-string: true
    include-client-info: true

logging:
  level:
    root: INFO
    "[com.akandiah.propmanager]": DEBUG
