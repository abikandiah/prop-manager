# dev-oidc profile: devcontainer Postgres + the shared homelab Logto (dev app + dev API resource).
# All values below are public, so the dev defaults live here. Run the app:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev-oidc
spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:propmange}
    username: ${POSTGRES_USER:propmange}
    password: ${POSTGRES_PASSWORD:devpassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  liquibase:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        from: ${MAIL_FROM:noreply@propmanager.local}
        smtp:
          auth: false
          starttls:
            enable: false
            required: false
          ssl:
            enable: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URI:https://auth.akandiah.ca/oidc/jwks}
          # Must match the 'iss' claim in Logto-issued JWTs.
          issuer-uri: ${AUTH_ISSUER_URI:https://auth.akandiah.ca/oidc}

app:
  base-url: ${APP_BASE_URL:http://localhost:3000}
  dev-seed:
    # Your Logto account email, so signing in links to the seeded org (set in .devcontainer/.env)
    email: ${DEV_SEED_EMAIL:}
  auth:
    logout-url: ${AUTH_LOGOUT_URL:https://auth.akandiah.ca/oidc/session/end}
    # Dev Logto API resource identifier (= VITE_OIDC_RESOURCE)
    audience: ${AUTH_AUDIENCE:https://prop-mange-api-dev}
  rate-limit:
    enabled: false
  cors:
    enabled: true
    allowed-origins: http://localhost:3000, http://127.0.0.1:3000
    allowed-methods: GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD
    allowed-headers: Authorization, Content-Type, X-Request-Id
    allow-credentials: true
    max-age: 3600
  audit:
    enabled: true
    include-query-string: true
    include-client-info: true

logging:
  level:
    root: INFO
    "[com.akandiah.propmanager]": DEBUG
