# Prod profile: homelab compose, shared PostgreSQL, shared Logto (OIDC only).
spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  mail:
    host: ${MAIL_HOST:smtp.resend.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:resend}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        from: ${MAIL_FROM:no-reply@propmanager.com}
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  liquibase:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Internal Logto URL on the homelab edge network; skips the tunnel round-trip.
          jwk-set-uri: ${JWKS_URI}
          # Used for 'iss' claim validation (must match the external domain).
          issuer-uri: ${AUTH_ISSUER_URI}

# Only health is exposed in prod; metrics/prometheus stay off the web entirely.
management:
  endpoints:
    web:
      exposure:
        include: health

app:
  auth:
    # Logto API resource identifier; tokens whose 'aud' lacks it are rejected.
    audience: ${AUTH_AUDIENCE}
  rate-limit:
    enabled: true
  cors:
    enabled: true
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://localhost,http://localhost:3000}
    allow-credentials: true
    max-age: 3600
  audit:
    enabled: true
    include-query-string: false
    include-client-info: true
