# Prod profile: docker-compose + PostgreSQL + Authentik (OIDC only).
spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  mail:
    host: ${MAIL_HOST:smtp.resend.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:resend}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        from: ${MAIL_FROM:no-reply@propmanger.com}
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  liquibase:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Overrides issuer-uri JWKS resolution — fetches keys from Authentik directly
          # (avoids a round-trip through the Cloudflare Tunnel for key validation).
          jwk-set-uri: ${JWKS_URI}

app:
  rate-limit:
    enabled: true
  cors:
    enabled: true
    allowed-origins:
      - ${CORS_ALLOWED_ORIGIN:https://localhost}
    allow-credentials: true
    max-age: 3600
  audit:
    enabled: true
    include-query-string: false
    include-client-info: true
